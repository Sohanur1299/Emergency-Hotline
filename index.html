<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Help Line</title>
    <!-- need to connect necessary information -->
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind css -->

</head>

<body>

    <nav class="max-w-[calc(100%-7.5rem)] mx-auto flex justify-between items-center px-6 py-4 border-2 border-red-500">

            <h1 class="text-2xl font-bold leading-6">Emergency <br>Service</h1>

        <div class="right-side flex items-center gap-4">

                <span class="font-bold">0</span>
                <img src="assets/heart.png" alt="" class="w-6 h-6">
            </div>


            <div id="coins" class="flex items-center gap-2 bg-green-100 rounded-full px-5 py-2">
                <span class="font-bold">0</span>
                <img src="assets/coin.png" alt="" class="w-6 h-6">
            </div>

            <button class="btn btn-success rounded-full px-6">2 Copy</button>
        </div>


    </nav>


    <section class="bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] py-10">
        <div class="max-w-[calc(100%-7.5rem)] mx-auto flex flex-col items-center text-center">
            <img src="assets/logo-dark.png" alt="" class="w-16 h-16">
            <h1 class="text-4xl font-bold text-white mt-3">Emergency Service Directory</h1>
            <p class="text-white mt-3 text-sm">Government Emergency Services at Your Fingertip – A Project by Government

        </div>
